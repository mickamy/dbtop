services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dev
    ports:
      - "5432:5432"
    volumes:
      - ./compose/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: dev
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppass"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Synthetic workload for developing dbtop. Opt-in via the "load" profile:
  #   make compose-up COMPOSE_PROFILE=load
  workload:
    image: golang:1.26-alpine
    profiles: ["load"]
    network_mode: "service:postgres"
    working_dir: /src
    command: ["go", "run", "./cmd/workload"]
    environment:
      WORKLOAD_DSN: postgres://postgres:pass@localhost:5432/dev
    volumes:
      - .:/src:ro
    depends_on:
      postgres:
        condition: service_healthy
